name: Contract CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "contract/**"
      - ".github/workflows/contract-ci-cd.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "contract/**"
      - ".github/workflows/contract-ci-cd.yml"

env:
  IS_PR: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-build:
    name: Contract build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: contract

      - name: Cargo build
        run: cargo build --release

  contract-fmt:
    name: Contract fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: contract

      - name: Cargo format check
        run: cargo fmt --all -- --check

  contract-clippy:
    name: Contract clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: contract

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    needs: [contract-build, contract-fmt, contract-clippy]
    defaults:
      run:
        working-directory: contract
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: contract

      - name: Run tests
        run: cargo test --all

  contract-parity:
    name: Contract parity check
    runs-on: ubuntu-latest
    needs: [contract-tests]
    defaults:
      run:
        working-directory: contract
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: contract

      - name: Verify KycStatus enum variants match backend
        run: |
          echo "Checking KycStatus enum variants in user_profile..."
          grep -q "Unverified = 0" contracts/user_profile/src/types.rs
          grep -q "Pending = 1" contracts/user_profile/src/types.rs
          grep -q "Verified = 2" contracts/user_profile/src/types.rs
          grep -q "Rejected = 3" contracts/user_profile/src/types.rs
          echo "Checking ScreeningStatus enum variants..."
          grep -q "Clear = 0" contracts/user_profile/src/types.rs
          grep -q "Flagged = 1" contracts/user_profile/src/types.rs
          grep -q "Blocked = 2" contracts/user_profile/src/types.rs
          echo "Parity check passed"

  # ============================================================================
  # AGGREGATE STATUS: single required check for branch protection
  # ============================================================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [contract-build, contract-fmt, contract-clippy, contract-tests, contract-parity]
    if: always()
    steps:
      - name: Check aggregate status
        shell: bash
        run: >
          for job in contract-build contract-fmt contract-clippy contract-tests contract-parity; do
            result="${{ needs[format(''{0}'', job)].result }}"
            if [ "$result" = "failure" ]; then
              echo "$job failed"
              exit 1
            fi
          done
          echo "All jobs passed"
