version: '3.8'

services:
  backend:
    image: ${DOCKER_IMAGE:-chioma-backend:latest}
    container_name: chioma-backend-${ENVIRONMENT:-production}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - STELLAR_NETWORK=${STELLAR_NETWORK:-mainnet}
      - SOROBAN_RPC_URL=${SOROBAN_RPC_URL}
      - SENTRY_DSN=${SENTRY_DSN}
      - ELASTICSEARCH_NODE=${ELASTICSEARCH_NODE:-http://elasticsearch:9200}
      - SEARCH_INDEX_PREFIX=${SEARCH_INDEX_PREFIX:-vespera}
      - SEARCH_OUTBOX_POLL_INTERVAL_MS=${SEARCH_OUTBOX_POLL_INTERVAL_MS:-5000}
      - SEARCH_OUTBOX_MAX_ATTEMPTS=${SEARCH_OUTBOX_MAX_ATTEMPTS:-5}
      - SEARCH_RECONCILE_CRON=${SEARCH_RECONCILE_CRON:-0 */15 * * * *}
    networks:
      - chioma-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: chioma-postgres-${ENVIRONMENT:-production}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - chioma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chioma-redis-${ENVIRONMENT:-production}
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - chioma-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: chioma-elasticsearch-${ENVIRONMENT:-production}
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=vespera-search
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - chioma-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

networks:
  chioma-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
